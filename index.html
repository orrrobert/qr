<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Photo QR Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary: #d42426; /* Santa Red */
      --primary-dark: #a31b1d;
      --radius: 12px;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f6f6f6;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #333;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: var(--radius);
      max-width: 420px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      font-size: 1.1rem;
      margin: 12px 0 6px;
      text-align: left;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      box-sizing: border-box;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 15px;
      text-align: left;
    }

    .checkbox-row input {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .checkbox-row label {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 18px;
      font-size: 1.2rem;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    #resultSection {
      margin-top: 30px;
      display: none;
      padding-bottom: 50px;
    }

    #qrcode {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      padding: 15px;
      background: white;
      display: inline-block;
      border-radius: 8px;
    }

    .instruction {
      font-size: 1.1rem;
      margin: 18px 0;
      font-weight: bold;
      color: #d42426;
    }
  </style>
</head>
<body>

  <h1>Photo Check-in</h1>

  <div class="card">
    <form id="qrForm">
      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" name="firstName" required autocomplete="given-name" placeholder="Santa">
      
      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" name="lastName" required autocomplete="family-name" placeholder="Claus">
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="santa@northpole.com">

      <div class="checkbox-row">
        <input type="checkbox" id="marketingOptIn" checked>
        <label for="marketingOptIn">Yes, keep me updated about seasonal updates and special offers.</label>
      </div>

      <button type="submit">Generate My QR Code</button>
    </form>
  </div>

  <div id="resultSection">
    <div id="qrcode"></div>
    <p class="instruction">Please show this code to the photographer!</p>
  </div>

  <script>
    document.getElementById("qrForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const first = document.getElementById("firstName").value.trim();
      const last = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const marketing = document.getElementById("marketingOptIn").checked ? "true" : "false";

      /**
       * SMART DATA STRUCTURE
       * \u0001 = SOH (Start of Header) - Start sentinel
       * \u0004 = EOT (End of Transmission) - End sentinel

      const qrData = `\u0001${first}|${last}|${email}|${marketing}\u0004`;

      document.getElementById("qrcode").innerHTML = ""; 

      new QRCode(document.getElementById("qrcode"), {
        text: qrData,
        width: 250,
        height: 250,
        correctLevel : QRCode.CorrectLevel.M
      });

      document.getElementById("resultSection").style.display = "block";
      
      // Smooth scroll to the QR code for mobile users
      setTimeout(() => {
        document.getElementById("resultSection").scrollIntoView({ behavior: "smooth" });
      }, 100);
    });
  </script>

</body>
</html>
